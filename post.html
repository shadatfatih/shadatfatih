<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Shadat Fatih | Post</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body class="home-page">


<header class="header">

    <a href="index.html" class="brand">

        <span>SHADAT</span> FATIH

    </a>


    <div class="header-actions">

        <a
            href="index.html"
            class="menu-btn"
            style="text-decoration:none;"
        >
            ←
        </a>

    </div>

</header>



<main
    style="
        max-width:900px;
        margin:60px auto;
        padding:20px;
    "
>


    <article
        id="postContainer"
        class="news-card"
    >

        <p>
            পোস্ট লোড হচ্ছে...
        </p>

    </article>


</main>



<script>

const SUPABASE_URL =
"https://ymwhodckmbybccufzjot.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_u31olXCxIcSsMdUeyyt5UQ_YeCWKToH";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


async function loadPost() {

    const container =
        document.getElementById("postContainer");


    /* URL থেকে post ID নেওয়া */

    const params =
        new URLSearchParams(
            window.location.search
        );

    const postId =
        params.get("id");


    console.log("Post ID:", postId);


    if (!postId) {

        container.innerHTML = `
            <h2>পোস্ট পাওয়া যায়নি</h2>

            <p>
                পোস্টের ID পাওয়া যায়নি।
            </p>
        `;

        return;
    }


    /* Supabase থেকে পোস্ট */

  const { data, error } =
    await supabaseClient
        .from("posts")
        .select("*")
        .eq("id", postId)
        .eq("published", true)
        .maybeSingle();


    console.log("Post data:", data);
    console.log("Post error:", error);


    if (error) {

        console.error(
            "Supabase Error:",
            error
        );

        container.innerHTML = `
            <h2>
                পোস্ট লোড করা যাচ্ছে না
            </h2>

            <p>
                ${escapeHTML(error.message)}
            </p>
        `;

        return;
    }


    if (!data) {

        container.innerHTML = `
            <h2>
                পোস্ট পাওয়া যায়নি
            </h2>

            <p>
                এই ID-এর কোনো পোস্ট পাওয়া যায়নি।
            </p>
        `;

        return;
    }



    /* Category */

    const categoryNames = {

        NU: "NATIONAL UNIVERSITY",

        CB: "CHATTOGRAM BOARD",

        AD: "ADMISSION",

        EX: "EXAM & ROUTINE",

        RS: "RESULT",

        NT: "NOTICE"

    };


    const category =
        categoryNames[data.category]
        || "EDUCATION UPDATE";


    /* Date */

    const date =
        data.created_at
        ? new Date(
            data.created_at
        ).toLocaleDateString(
            "en-GB",
            {
                day: "2-digit",
                month: "long",
                year: "numeric"
            }
        )
        : "";


    /* Image */

    const imageHTML =
        data.image_url
        ? `
            <img
                src="${escapeAttribute(data.image_url)}"
                alt="${escapeAttribute(data.title || "Post image")}"
                style="
                    width:100%;
                    max-height:600px;
                    object-fit:cover;
                    border-radius:16px;
                    margin:25px 0;
                    display:block;
                "
            >
        `
        : "";


    /* PDF */

    const pdfHTML =
        data.pdf_url
        ? `
            <div
                style="
                    margin-top:30px;
                    padding:20px;
                    border:1px solid #ddd;
                    border-radius:14px;
                "
            >

                <h3>
                    📄 PDF Document
                </h3>

                <a
                    href="${escapeAttribute(data.pdf_url)}"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="read-more"
                >
                    PDF দেখুন / খুলুন →
                </a>

            </div>
        `
        : "";


    /* Full Post */

    container.innerHTML = `

        <div class="news-top">

            <span class="tag red">
                ${escapeHTML(category)}
            </span>

            <span class="date">
                ${escapeHTML(date)}
            </span>

        </div>


        <h1>
            ${escapeHTML(data.title)}
        </h1>


        ${imageHTML}


        <div
            style="
                margin-top:25px;
                line-height:1.9;
                white-space:pre-line;
                font-size:17px;
            "
        >
            ${escapeHTML(data.content)}
        </div>


        ${pdfHTML}

    `;

}


/* HTML Security */

function escapeHTML(value) {

    return String(value ?? "")

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


function escapeAttribute(value) {

    return escapeHTML(value);

}


loadPost();

</script>


</body>

</html>
